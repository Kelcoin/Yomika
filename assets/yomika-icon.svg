<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Yomika app icon</title>
  <desc id="desc">Yomika geometric mark in a rounded square.</desc>
  <!-- Every stroke and dot rides on currentColor so the in-app marks follow the
       theme and the colour schemes; the window icon keeps the original palette
       in src-tauri/icons and is unaffected by this file. -->
  <rect width="512" height="512" rx="112" fill="#0D0D0D"/>
  <g stroke="currentColor">
    <rect x="112" y="112" width="288" height="288" rx="20" stroke-width="18" fill="none"/>
    <line x1="184" y1="184" x2="184" y2="328" stroke-width="18" stroke-linecap="round"/>
    <line x1="184" y1="184" x2="264" y2="184" stroke-width="18" stroke-linecap="round"/>
    <line x1="224" y1="184" x2="224" y2="264" stroke-width="18" stroke-linecap="round"/>
    <line x1="264" y1="224" x2="328" y2="224" stroke-width="18" stroke-linecap="round"/>
  </g>
  <circle cx="288" cy="296" r="22" fill="currentColor"/>
</svg>
