<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Yomika mark</title>
  <desc id="desc">Yomika mark for Android's adaptive icon, drawn on 68% of the 512 canvas. Derived from assets/yomika-mark.svg; do not edit by hand.</desc>
  <!-- Generated by .github/scripts/derive-logo.mjs from assets/yomika-mark.svg.
       No plate: the launcher mask supplies the background and icon-manifest.json
       passes bg_color for it. The mark is drawn on 68% of the canvas because
       Android shows only the middle 72dp of the 108dp adaptive canvas — at 100%
       the mark lands at ~89% of the visible range and the launcher mask bites it
       (user report: "四周边缘太小、图标占得太满"). 68% puts it at ~63% of the
       visible range, leaving the ~17% gutter launcher icons normally have.
       The android_fg_scale manifest field is inert in tauri-cli 2.11.4 (50 and 80
       produce byte-identical output), so the scale has to live in the source.
       Do not hand-edit: run the script. -->
  <g transform="translate(256 256) scale(0.68) translate(-256 -256)">
    <path d="M112 130 Q181 132 236 174 L236 278 Q182 238 112 238 Z" fill="#F5F5F5"/>
    <path d="M400 130 Q331 132 276 174 L276 278 Q330 238 400 238 Z" fill="#F5F5F5"/>
    <path d="M127 264 Q193 268 256 313 Q319 268 385 264 L385 293 Q322 300 276 340 L276 390 L236 390 L236 340 Q190 300 127 293 Z" fill="#F5F5F5"/>
    <path d="M340 142 Q360 135 378 133 L378 208 L359 194 L340 210 Z" fill="#B63A2E"/>
  </g>
</svg>
