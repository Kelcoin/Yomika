[package]
name = "yomika"
version = "1.0.0"
description = "Local-first reading and archive client"
authors = ["Yomika contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "yomika_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# 把 NGX 核心的垫片（vendor/ngx/ngx_shim.c，/MT）编成一个小 DLL：我们的 Rust 是
# /MD，直接链 SDK 那份静态库会被链接器按 LNK2038 挡下来。
cc = "1"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
keyring = { version = "3", features = ["windows-native"] }
url = "2"
base64 = "0.22"
sha2 = "0.10"
blake3 = "1"
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "blocking"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
# NFKC normalization for dedup filename matching (Readoshi parity).
unicode-normalization = "0.1"
ort = { version = "2.0.0-rc.13", features = ["download-binaries"] }

[features]
# Tauri tells production builds apart from development ones with this feature:
# enabling it turns `cfg(dev)` off, and that is what makes the app serve the
# frontend compiled into the binary instead of reaching for `devUrl`. The CLI
# enables it on its own for `tauri build` and `tauri android/ios build`, but a
# hand-rolled `cargo build` has to pass `--features custom-protocol` itself.
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]

# Native clipboard write: the webview API prompts WebView2 users for clipboard
# permission on every export, the OS board does not. arboard has no Android
# backend, so mobile targets must compile without it; platform.rs reports the
# clipboard as unavailable there.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
arboard = "3"

[target."cfg(windows)".dependencies]
# Win32_Security 只为了 `CreateMutexW` 的 cfg 门（单实例守卫要用它）——同一个 crate
# 自带这个 feature，不用多拉一个依赖。
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Graphics_Direct3D", "Win32_System_Memory", "Win32_System_Diagnostics_Debug", "Win32_UI_WindowsAndMessaging"] }

# 发布构建不带符号表。
#
# Android 的 .so 里 `.symtab`(5.4MB) + `.strtab`(11.6MB) 一共 17MB，而 APK 里的原生库
# 是不压缩存放的（AGP 的 extractNativeLibs=false，为的是能从 APK 直接 mmap），所以那
# 17MB 一分不少地落在下载里——Windows 的 exe 与 iOS 的 dylib 都被 deflate 盖掉了一半，
# 只有 APK 把真实体积摊在外面。实测：--strip-all 之后 64.3MB → 47.4MB，`.text` /
# `.rodata` 逐字节不变，动态链接要的 `.dynsym` 保留。iOS 的 __LINKEDIT 有 22MB 同类
# 内容，Windows 那边 rustc 本来就没留 COFF 符号表。
#
# 只动 release：debug 构建（手机上 jni 调试、本地 cargo test）符号照旧。应用自己的
# panic 日志（`error_log::install_panic_hook`）存的是 panic 文案 + `file:line`，那是编译
# 期写进 .rodata 的，不受影响；只有 std 默认钩子打印的栈会变成地址，需要可读回溯时
# 单独编一份不 strip 的即可。代码里没有任何地方读自己的符号表（无 backtrace / dladdr）。
[profile.release]
strip = "symbols"
