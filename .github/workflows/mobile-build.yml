name: Mobile and Windows Packages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --no-audit --no-fund
      - run: npm run tauri build -- --ci
      - name: Package Windows portable build
        shell: pwsh
        run: |
          $exe = 'src-tauri/target/release/yomika.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "Missing portable executable: $exe" }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -LiteralPath $exe -DestinationPath 'artifacts/Yomika-windows-portable.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: yomika-windows-portable
          path: artifacts/Yomika-windows-portable.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - run: npm ci --no-audit --no-fund
      - run: npx tauri android init --ci --skip-targets-install
      - name: Configure Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > src-tauri/gen/android/release.keystore
      - name: Build signed Android packages
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npx tauri android build --ci --apk --aab --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: yomika-android
          path: src-tauri/gen/android/app/build/outputs/**/*
          if-no-files-found: error

  ios-unsigned:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --no-audit --no-fund
      - run: npx tauri ios init --ci
      - run: npm run build
      - name: Build unsigned iOS app
        run: |
          xcodebuild -project src-tauri/gen/apple/yomika.xcodeproj -scheme yomika -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/yomika-ios" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build
          app="$RUNNER_TEMP/yomika-ios/Build/Products/Release-iphoneos/yomika.app"
          test -d "$app"
          mkdir -p artifacts/Payload
          cp -R "$app" artifacts/Payload/Yomika.app
          (cd artifacts && zip -qry Yomika-unsigned.ipa Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: yomika-ios-unsigned
          path: artifacts/Yomika-unsigned.ipa
          if-no-files-found: error
