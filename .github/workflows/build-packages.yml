name: Build Packages and Releases

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag of the app release to publish (e.g. app-v0.1.0). Leave empty to only publish Actions artifacts.'
        required: false
        type: string
      draft:
        description: 'Create a draft release instead of publishing right away'
        type: boolean
        default: true
  # 打包只在被明确要求时跑：手动触发（上面）或推一个 app-v* 标签。之前它也跟着
  # main 的每次 push 跑，于是普通一次提交会同时起两个 run（CI + 打包），而打包的
  # 三个平台构建加上产物上传要花掉不少额度和时间。
  push:
    # Model releases own the v* tags; app releases use the app-v* prefix.
    tags: ['app-v*']

permissions:
  contents: read

jobs:
  windows:
    needs: [prepare-release]
    # 没有 tag 输入时 prepare-release 会被跳过，构建本身仍要跑。
    if: always()
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --no-audit --no-fund
      # build.ps1 carries the Windows-specific packaging work: it strips the
      # non-Windows ONNX dylibs ort drops next to the exe, resolves the
      # DirectML.dll symlink into a real file, and stages the bundled model
      # under data/models where the app expects it.
      - name: Build portable executable
        shell: pwsh
        run: ./tools/windows/build.ps1 -Release -UseHostTools
      - name: Package Windows zip
        shell: pwsh
        run: |
          $target = 'src-tauri/target/release'
          $exe = Join-Path $target 'yomika.exe'
          $directMl = Join-Path $target 'DirectML.dll'
          $model = Join-Path $target 'data/models/waifu2x-upconv7'
          if (-not (Test-Path -LiteralPath $exe)) { throw "Missing portable executable: $exe" }
          if (-not (Test-Path -LiteralPath $directMl)) { throw "Missing runtime library: $directMl" }
          if (-not (Test-Path -LiteralPath $model -PathType Container)) { throw "Missing bundled model: $model" }
          $stage = 'artifacts/yomika-windows'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -LiteralPath $exe -Destination $stage -Force
          Copy-Item -LiteralPath $directMl -Destination $stage -Force
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'data/models') | Out-Null
          Copy-Item -LiteralPath $model -Destination (Join-Path $stage 'data/models') -Recurse -Force
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath 'artifacts/yomika-windows.zip' -Force
      # 产物直接传给 release，不再经过 Actions artifacts：release 资产不占
      # Actions 存储配额，而这个私有仓库的配额（500MB）早就被构建缓存顶满，
      # `upload-artifact` 每次都被拒（"Artifact storage quota has been hit"）。
      - name: Attach the Windows package to the release
        if: needs.prepare-release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.prepare-release.outputs.tag }}" artifacts/yomika-windows.zip --clobber

  android:
    needs: [prepare-release]
    # 没有 tag 输入时 prepare-release 会被跳过，构建本身仍要跑。
    if: always()
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # 镜像里已经带了 Android SDK 与 cmdline-tools，所以直接用它装缺的包。
      # 原来那步 `android-actions/setup-android@v3` 自己会去装 `tools` 包，而这个包
      # 已经从 Google 的仓库里撤掉了（被 cmdline-tools 取代），于是它在 20 秒内
      # 就失败，连后面的 sdkmanager 都没跑到。
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager=$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -1)
          "$sdkmanager" --version
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - run: npm ci --no-audit --no-fund
      - run: npx tauri android init --ci --skip-targets-install
      - name: Configure Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > src-tauri/gen/android/release.keystore
          keytool -list -keystore src-tauri/gen/android/release.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
      - name: Build signed Android packages
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npx tauri android build --ci --apk --aab --target aarch64
      - name: Attach the Android packages to the release
        if: needs.prepare-release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          tag="${{ needs.prepare-release.outputs.tag }}"
          apk=$(find src-tauri/gen/android/app/build/outputs -name '*.apk' -print -quit)
          test -n "$apk"
          cp "$apk" artifacts/yomika-arm64-v8a.apk
          gh release upload "$tag" artifacts/yomika-arm64-v8a.apk --clobber
          aab=$(find src-tauri/gen/android/app/build/outputs -name '*.aab' -print -quit || true)
          if [ -n "$aab" ]; then
            cp "$aab" artifacts/yomika-arm64-v8a.aab
            gh release upload "$tag" artifacts/yomika-arm64-v8a.aab --clobber
          fi

  ios-unsigned:
    needs: [prepare-release]
    # 没有 tag 输入时 prepare-release 会被跳过，构建本身仍要跑。
    if: always()
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - run: npm ci --no-audit --no-fund
      # tauri ios init shells out to xcodegen to render the .xcodeproj; the
      # runner image does not preinstall it.
      - name: Install XcodeGen
        run: brew install xcodegen
      - run: npx tauri ios init --ci
      - run: npm run build
      # Tauri 的 Xcode 脚本阶段（`tauri ios xcode-script`）要读 `tauri ios dev`
      # 写下的 dev-server 地址文件，没有它就 panic —— 未签名的发布构建用不上开发
      # 服务器，所以这里自己先编好 iOS 的 Rust 库，再把那个阶段改成空操作。
      # （这段 workaround 在 7c293b6 被删掉，此后 iOS 作业每次都挂在这一步。）
      - name: Build Rust for iOS
        run: cargo build --target aarch64-apple-ios --manifest-path src-tauri/Cargo.toml
      - name: Disable Tauri dev-server Xcode phase for unsigned release
        shell: bash
        run: |
          set -euo pipefail
          project=$(find src-tauri/gen/apple -maxdepth 1 -name '*.xcodeproj' -print -quit)
          test -n "$project"
          pbxproj="$project/project.pbxproj"
          test -f "$pbxproj"
          ruby -pi -e '$_ = $_.sub(/shellScript = .*xcode-script.*;/, %q{shellScript = "exit 0";}) if $_.include?("xcode-script")' "$pbxproj"
          if grep -q 'xcode-script' "$pbxproj"; then
            echo 'Tauri xcode-script phase was not disabled' >&2
            exit 1
          fi
      # Tauri 的构建阶段本来会把 iOS 的 Rust 静态库放进 gen/apple/Externals/<arch>/
      # <config>/libapp.a —— Xcode 工程就是按 `-lapp` 去那里找的。阶段被禁用后
      # 得自己放，否则链接阶段报 `ld: library 'app' not found`。
      - name: Stage the Rust library where Xcode links it
        shell: bash
        run: |
          set -euo pipefail
          lib=$(find src-tauri/target/aarch64-apple-ios -maxdepth 2 -name 'lib*.a' -print -quit)
          test -n "$lib"
          for config in debug release; do
            mkdir -p "src-tauri/gen/apple/Externals/arm64/$config"
            cp "$lib" "src-tauri/gen/apple/Externals/arm64/$config/libapp.a"
          done
          ls -l src-tauri/gen/apple/Externals/arm64/*/libapp.a
      - name: Build unsigned iOS app
        run: |
          project=$(find src-tauri/gen/apple -name '*.xcodeproj' -maxdepth 1 -print -quit)
          scheme=$(xcodebuild -list -project "$project" | awk '/Schemes:/{getline; gsub(/^[[:space:]]+|[[:space:]]+$/, ""); print; exit}')
          test -n "$scheme"
          xcodebuild -project "$project" -scheme "$scheme" -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/yomika-ios" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build
          app=$(find "$RUNNER_TEMP/yomika-ios/Build/Products" -type d -name '*.app' -path '*iphoneos*' -print -quit)
          test -d "$app"
          mkdir -p artifacts/Payload
          cp -R "$app" artifacts/Payload/Yomika.app
          (cd artifacts && zip -qry Yomika-unsigned.ipa Payload)
      - name: Attach the iOS package to the release
        if: needs.prepare-release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp artifacts/Yomika-unsigned.ipa "artifacts/yomika-arm64-unsigned.ipa"
          gh release upload "${{ needs.prepare-release.outputs.tag }}" artifacts/yomika-arm64-unsigned.ipa --clobber

  # 先建好草稿 release（有 tag 输入或推了 app-v* 标签时），三个构建平台再把各自的
  # 包直接传进去。以前是各平台传 Actions artifact、最后由一个 job 汇总，但那一步
  # 会撞上账号的 Actions 存储配额；release 资产不占这份配额，所以改成直传。
  prepare-release:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
      || startsWith(github.ref, 'refs/tags/app-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.release_tag || github.ref_name }}"
          draft="${{ inputs.draft }}"
          if [ "${{ github.event_name }}" = "push" ]; then draft=false; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists; the builds will replace its assets."
            exit 0
          fi
          args=("$tag" --title "Yomika $tag" --generate-notes --target "$GITHUB_SHA")
          if [ "$draft" = "true" ]; then args+=(--draft); fi
          gh release create "${args[@]}"
