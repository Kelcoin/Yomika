name: Build Packages and Releases

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag of the release to publish to: `app-test` is the rolling test draft, `app-v*` are real releases. Leave empty to build without publishing.'
        required: false
        default: 'app-test'
        type: string
      draft:
        description: 'Create a draft release instead of publishing right away'
        type: boolean
        default: true
  # 打包只在被明确要求时跑：手动触发（上面）或推一个 app-v* 标签。之前它也跟着
  # main 的每次 push 跑，于是普通一次提交会同时起两个 run（CI + 打包），而打包的
  # 三个平台构建加上产物上传要花掉不少额度和时间。
  push:
    # Model releases own the v* tags; app releases use the app-v* prefix.
    tags: ['app-v*']

# 产物只有一处去处：草稿 release（或 app-v* 标签推上来的正式 release）。三个平台
# 本来还会各传一份 run artifact，但私有仓库的 Actions 存储配额是**按账号**算的，
# 而这个账号的计数被早先删掉的构建缓存卡住了：实际占用只有 148MB（三个 npm 缓存），
# GitHub 仍按 748MB 拒收，报 "Artifact storage quota has been hit"，官方说明是
# 「每 6–12 小时重算一次」。所以那三步只是在每次 run 里留一个红色的失败记录，交付
# 本来就靠 release。配额恢复正常后想加回来，路径分别是：
#   windows: artifacts/yomika-windows.zip
#   android: src-tauri/gen/android/app/build/outputs/**/*
#   ios:     artifacts/Yomika-unsigned.ipa
#
# 产物名与发布方式：每个包叫 yomika-<版本>-<短commit>-<平台>.<扩展名>（版本取自
# src-tauri/tauri.conf.json）——即 Node / ripgrep / uv 那套「名称-版本-平台、扩展名
# 最后」的顺序，commit 跟在版本之后（构建元数据该在的位置）而不是塞在变体位上；
# 包内容的 SHA-256 写进 run 摘要，不再产出 .sha256 文件。发布统一走
# .github/scripts/publish-assets.sh，它只清掉**本平台**的旧产物，所以三个作业可以
# 并发，而 release 里最终只剩最新一次构建。默认目标是滚动更新的测试草稿 release
# `app-test`；正式发布仍然由 app-v* 标签（或手动填 tag）指定。

permissions:
  contents: read

jobs:
  windows:
    needs: [prepare-release]
    # 没有 tag 输入时 prepare-release 会被跳过，构建本身仍要跑。
    if: always()
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # ort-sys rc.13 assumes the Cargo 1.98 OUT_DIR layout when copying
      # DirectML.dll. Cargo 1.100 adds a level and sends it to the wrong directory.
      - uses: dtolnay/rust-toolchain@1.98.0
      - run: npm ci --no-audit --no-fund
      # The Windows build script carries the Windows-specific packaging work: it
      # strips the non-Windows ONNX dylibs ort drops next to the exe, resolves the
      # DirectML.dll symlink into a real file, and stages the bundled model under
      # data/models where the app expects it. It lives under .github/scripts so
      # that the local Windows build (build_exe.bat) runs the very same file.
      - name: Build portable executable
        shell: pwsh
        run: ./.github/scripts/build-windows.ps1 -Release -UseHostTools
      - name: Package Windows zip
        shell: pwsh
        # 打包这件事只在这里写一遍。原来那段内联的 Copy-Item 漏了计算进程那一份
        # 可执行文件：包里没有 worker 时主窗照样起得来，只是算力那一栏只能报
        # 「找不到 worker 可执行文件」（冷启动自检在 2026-10-08 就是这么红的）。
        # 脚本里那四样缺一件就红，末尾还会跑一遍包自检。
        run: ./.github/scripts/package-windows.ps1 -TargetDir src-tauri/target/release -Stage artifacts/yomika-windows -Output artifacts/yomika-windows.zip -Manifest artifacts/release-manifest.json
      - name: Publish the Windows package to the release
        if: needs.prepare-release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # 清单跟着包一起发：它写着逐文件 sha256、随包模型、两份构建戳、协议大版本、
          # 许可证与已知限制指针（docs/71:666）。原来只有 CI 摘要里那一行 hash，
          # 翻不回来；现在下载页上多一个 json，谁都能拿它对一遍。
          bash .github/scripts/publish-assets.sh \
            "${{ needs.prepare-release.outputs.tag }}" \
            "${{ needs.prepare-release.outputs.draft }}" \
            windows-x64 artifacts/yomika-windows.zip artifacts/release-manifest.json

  android:
    needs: [prepare-release]
    # 没有 tag 输入时 prepare-release 会被跳过，构建本身仍要跑。
    if: always()
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # 镜像里已经带了 Android SDK 与 cmdline-tools，所以直接用它装缺的包。
      # 原来那步 `android-actions/setup-android@v3` 自己会去装 `tools` 包，而这个包
      # 已经从 Google 的仓库里撤掉了（被 cmdline-tools 取代），于是它在 20 秒内
      # 就失败，连后面的 sdkmanager 都没跑到。
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager=$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -1)
          "$sdkmanager" --version
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - run: npm ci --no-audit --no-fund
      # 构建戳必须先落进环境：`gen/android/app/build.gradle.kts` 里 `rustBuild*` 的
      # onlyIf 靠它跳过 Gradle 那一遍 cargo（CLI 已经编过同一份）。少了它，CI 会白编
      # 一遍，而且那第二遍跑在 Gradle 守护进程的环境里——`ORT_LIB_PATH` 不在那里时，
      # 它会重编出一个没链 ONNX Runtime 的主库，装到手机上加载即失败。
      - name: Pin the build stamp
        shell: bash
        run: echo "YOMIKA_BUILD_COMMIT=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"
      - run: npx tauri android init --ci --skip-targets-install
      - name: Build pinned Android ONNX Runtime with NNAPI
        run: |
          python3 -m pip install 'cmake==3.31.6' 'ninja==1.11.1.4' numpy packaging
          python3 .github/scripts/prepare-mobile-ort.py android
          python3 .github/scripts/prepare-mobile-npu.py
          python3 .github/scripts/prepare-mobile-ncnn.py
      # `init` 生成的工程带的是模板默认图标，`tauri icon` 才会把项目图标写进去：
      # 存在 gen/<平台> 工程时写进工程，否则退回 icons/<平台>。少了这一步，APK 的
      # 启动图标一直是 Tauri 那套默认图。
      - name: Write the project icons into the generated Android project
        run: npx tauri icon src-tauri/icons/icon-manifest.json
      - name: Configure Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > src-tauri/gen/android/release.keystore
          keytool -list -keystore src-tauri/gen/android/release.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
      # 只出 APK：应用从 release 分发，不上 Google Play，而 .aab 本身不能直接安装
      # （要经 Play 或 bundletool 再加工成设备专用的 APK）。
      - name: Build the signed Android APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npx tauri android build --ci --apk --target aarch64
      - name: Verify Android native runtime dependency closure
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find src-tauri/gen/android/app/build/outputs -name '*.apk' -print -quit)
          test -n "$apk"
          python3 .github/scripts/verify-mobile-runtime.py "$apk" --readelf "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
      - name: Publish the Android package to the release
        if: needs.prepare-release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          apk=$(find src-tauri/gen/android/app/build/outputs -name '*.apk' -print -quit)
          test -n "$apk"
          cp "$apk" artifacts/yomika-arm64-v8a.apk
          bash .github/scripts/publish-assets.sh \
            "${{ needs.prepare-release.outputs.tag }}" \
            "${{ needs.prepare-release.outputs.draft }}" \
            android-arm64-v8a artifacts/yomika-arm64-v8a.apk

  ios-unsigned:
    needs: [prepare-release]
    # 没有 tag 输入时 prepare-release 会被跳过，构建本身仍要跑。
    if: always()
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - run: npm ci --no-audit --no-fund
      # 同一个理由：构建戳要先进环境，交付物的身份才等于这一次提交，Xcode 那一侧也不必
      # 靠守护进程的环境去猜。
      - name: Pin the build stamp
        shell: bash
        run: echo "YOMIKA_BUILD_COMMIT=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"
      # tauri ios init shells out to xcodegen to render the .xcodeproj; the
      # runner image does not preinstall it.
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Validate iOS Face ID permission
        run: |
          set -euo pipefail
          plutil -lint src-tauri/Info.ios.plist
          face_id_reason=$(plutil -extract NSFaceIDUsageDescription raw src-tauri/Info.ios.plist)
          test -n "$face_id_reason"
      - run: npx tauri ios init --ci
      # Direct xcodebuild bypasses the plist merge performed by `tauri ios build`.
      - name: Merge iOS app permissions into the Xcode target
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          target = Path("src-tauri/gen/apple/yomika_iOS/Info.plist")
          generated = plistlib.loads(target.read_bytes())
          overrides = plistlib.loads(Path("src-tauri/Info.ios.plist").read_bytes())
          generated.update(overrides)
          target.write_bytes(plistlib.dumps(generated, sort_keys=False))
          PY
      - name: Build pinned iOS ONNX Runtime with CoreML
        run: |
          python3 -m pip install --break-system-packages 'cmake==3.31.6' numpy packaging
          python3 .github/scripts/prepare-mobile-ort.py ios
      # 与 Android 作业同理：init 生成的资产目录里是 Tauri 的默认图标，这一步用
      # 项目图标（icon-manifest.json）覆盖 AppIcon.appiconset。
      - name: Write the project icons into the generated Xcode project
        run: npx tauri icon src-tauri/icons/icon-manifest.json
      - run: npm run build
      # Tauri 的 Xcode 脚本阶段（`tauri ios xcode-script`）要读 `tauri ios dev`
      # 写下的 dev-server 地址文件，没有它就 panic —— 未签名的发布构建用不上开发
      # 服务器，所以这里自己先编好 iOS 的 Rust 库，再把那个阶段改成空操作。
      # （这段 workaround 在 7c293b6 被删掉，此后 iOS 作业每次都挂在这一步。）
      # `--features custom-protocol` 是「装完进不去界面」的原因：缺了它就等于开发
      # 构建，运行时 tauri:// 协议会把每个资源请求代理到 devUrl（http://localhost:
      # 27790），于是报 did you grant local network permissions?。CLI 自己跑 build
      # 时会自动带上这个 feature，这里手写 cargo 必须显式给。顺便改成 release：
      # 之前编的是 debug 库，只是当时没人注意链接进去的是什么。
      - name: Build Rust for iOS
        run: cargo build --release --target aarch64-apple-ios --features custom-protocol --manifest-path src-tauri/Cargo.toml
      - name: Disable Tauri dev-server Xcode phase for unsigned release
        shell: bash
        run: |
          set -euo pipefail
          project=$(find src-tauri/gen/apple -maxdepth 1 -name '*.xcodeproj' -print -quit)
          test -n "$project"
          pbxproj="$project/project.pbxproj"
          test -f "$pbxproj"
          ruby -pi -e '$_ = $_.sub(/shellScript = .*xcode-script.*;/, %q{shellScript = "exit 0";}) if $_.include?("xcode-script")' "$pbxproj"
          if grep -q 'xcode-script' "$pbxproj"; then
            echo 'Tauri xcode-script phase was not disabled' >&2
            exit 1
          fi
      # Tauri 的构建阶段本来会把 iOS 的 Rust 静态库放进 gen/apple/Externals/<arch>/
      # <config>/libapp.a —— Xcode 工程就是按 `-lapp` 去那里找的。阶段被禁用后
      # 得自己放，否则链接阶段报 `ld: library 'app' not found`。
      - name: Stage the Rust library where Xcode links it
        shell: bash
        run: |
          set -euo pipefail
          lib=$(find src-tauri/target/aarch64-apple-ios/release -maxdepth 1 -name 'lib*.a' -print -quit)
          test -n "$lib"
          for config in debug release; do
            mkdir -p "src-tauri/gen/apple/Externals/arm64/$config"
            cp "$lib" "src-tauri/gen/apple/Externals/arm64/$config/libapp.a"
          done
          ls -l src-tauri/gen/apple/Externals/arm64/*/libapp.a
      # 静态库里如果留着 ort-sys 的链接占位符（没设 `ORT_IOS_XCFWK_PATH` 时它就长那样），
      # Xcode 那一侧永远不会去链真正的 ONNX Runtime：链接会过、包也出得来，装到设备上
      # 加载主库直接失败。这里在**真正交给 Xcode 的那一份**上验一次。
      - name: Verify the staged iOS library links ONNX Runtime
        shell: bash
        run: python3 .github/scripts/verify-mobile-runtime.py src-tauri/gen/apple/Externals/arm64/release/libapp.a --ios
      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          project=$(find src-tauri/gen/apple -name '*.xcodeproj' -maxdepth 1 -print -quit)
          scheme=$(xcodebuild -list -project "$project" | awk '/Schemes:/{getline; gsub(/^[[:space:]]+|[[:space:]]+$/, ""); print; exit}')
          test -n "$scheme"
          xcodebuild -project "$project" -scheme "$scheme" -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/yomika-ios" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' FRAMEWORK_SEARCH_PATHS="\$(inherited) $ORT_IOS_XCFWK_PATH/ios-arm64" OTHER_LDFLAGS="\$(inherited) -framework onnxruntime -framework CoreML -framework Metal -framework Accelerate -framework LocalAuthentication -framework UIKit -framework Foundation -lc++" build
          app=$(find "$RUNNER_TEMP/yomika-ios/Build/Products" -type d -name '*.app' -path '*iphoneos*' -print -quit)
          test -d "$app"
          # Validate the final bundle, so an init/config merge regression cannot
          # ship an app which terminates as soon as Face ID is requested.
          face_id_reason=$(plutil -extract NSFaceIDUsageDescription raw "$app/Info.plist")
          test -n "$face_id_reason"
          mkdir -p artifacts/Payload
          cp -R "$app" artifacts/Payload/Yomika.app
          (cd artifacts && zip -qry Yomika-unsigned.ipa Payload)
      - name: Publish the iOS package to the release
        if: needs.prepare-release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp artifacts/Yomika-unsigned.ipa artifacts/yomika-arm64-unsigned.ipa
          bash .github/scripts/publish-assets.sh \
            "${{ needs.prepare-release.outputs.tag }}" \
            "${{ needs.prepare-release.outputs.draft }}" \
            ios-arm64-unsigned artifacts/yomika-arm64-unsigned.ipa

  # 先建好草稿 release（有 tag 输入或推了 app-v* 标签时），三个构建平台再把各自的
  # 包直接传进去。以前是各平台传 Actions artifact、最后由一个 job 汇总，但那一步
  # 会撞上账号的 Actions 存储配额；release 资产不占这份配额，所以改成直传。
  prepare-release:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
      || startsWith(github.ref, 'refs/tags/app-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      # Whether the release is a draft, so a build job that has to recreate it
      # keeps the same visibility the run asked for.
      draft: ${{ steps.release.outputs.draft }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.release_tag || github.ref_name }}"
          draft="${{ inputs.draft }}"
          if [ "${{ github.event_name }}" = "push" ]; then draft=false; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists; the builds will replace its assets."
            exit 0
          fi
          args=("$tag" --title "Yomika $tag" --generate-notes --target "$GITHUB_SHA")
          if [ "$draft" = "true" ]; then args+=(--draft); fi
          gh release create "${args[@]}"
