name: Model Release

on:
  push:
    tags: ['v*']

jobs:
  release-models:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate manifest
        shell: pwsh
        run: ./tools/models/release-manifest.ps1 -Tag "${{ github.ref_name }}"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --generate-notes
      - name: Upload assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" "src-tauri/resources/models/${{ github.ref_name }}.manifest.json"
          $assets = Get-ChildItem "docs/Aletheia-Lens/_internal/models-fp16" -File -Recurse -ErrorAction SilentlyContinue | ForEach-Object FullName
          if ($assets) { gh release upload "${{ github.ref_name }}" $assets }
