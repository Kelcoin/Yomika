name: CI

# 测试不再跟着每次 push 跑：一次提交本来会同时起 CI 和打包两个 run，白花两倍
# 额度与时间。留着手动触发，需要时点一下（或开 PR）即可。
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # 两个 Node 版本各自报结果：之前 fail-fast 会把 22 的作业连带取消，只剩
      # 20 那一条失败信息，看不出问题出在版本上还是代码上。
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run

      - name: Production build
        run: npm run build

  rust-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use stable Rust
        uses: dtolnay/rust-toolchain@stable

      # 只缓存 Cargo 的 registry/git 源码，不缓存 target/：这个仓库是私有的，
      # Actions 存储配额只有 500MB（Free），而 target 缓存一份就 600MB——攒满之
      # 后 `upload-artifact` 全线被拒（打包产物因此在 Actions 里看不到）。CI 现在
      # 只在手动或 PR 时跑，重编一次换回配额是划算的。
      - name: Cache Rust sources
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-targets: false

      - name: Run native tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
